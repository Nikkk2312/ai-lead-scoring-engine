# AI Lead Scoring Engine - Docker Compose
# One-command deploy: docker compose up -d

services:
  ollama:
    image: ollama/ollama:latest
    container_name: lead-scorer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Pull model on first run: docker exec lead-scorer-ollama ollama pull llama3.1:8b

  lead-scorer:
    build: .
    container_name: lead-scorer-app
    ports:
      - "5000:5000"
    volumes:
      - scorer_data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - DATABASE_URL=sqlite:///data/lead_scorer.db
      - DASHBOARD_PORT=5000
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    command: python main.py dashboard

volumes:
  ollama_data:
  scorer_data:
